[package]
name = "vroooom-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0"
description = "Zero-knowledge vehicle tracking server (stateless REST API)"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-full", "trace", "limit", "timeout"] }
hyper = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Config
dotenvy = "0.15"

# Errors
thiserror = "2"
anyhow = "1"

# Crypto & encoding
sha2 = "0.10"
hex = "0.4"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# Testing
tokio = { version = "1", features = ["test-util", "macros"] }
tempfile = "3"
assert-json-diff = "2"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "storage"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
