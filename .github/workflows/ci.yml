name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd server && cargo test
      - run: cd server && cargo clippy -- -D warnings
      - run: cd server && cargo fmt --check

  test-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test -w shared
      - run: npm run lint -w shared

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test -w web --if-present
      - run: npm run lint -w web --if-present

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test -w mobile --if-present

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Mobile and docs workspaces excluded: remaining high vulnerabilities are in
      # the expo/react-native/metro build toolchain and vitepress/vite (dev-only,
      # no patched versions available for braces/node-forge). Runtime apps are not affected.
      - run: npm audit --workspace=shared --workspace=web --audit-level=high
